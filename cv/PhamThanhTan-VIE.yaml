          - Bổ sung 14 voicepack tiếng Việt hoán đổi lúc chạy trên một backbone dùng chung, scheduler có backpressure, health/metrics probe và manifest triển khai GPUStack.
      - name: "[TapViet Studio](https://tanpham380.github.io/tapviet-studio/)"
