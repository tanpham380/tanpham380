          - Tự động hóa cấu hình model/runtime bằng Python configurator, kèm thiết lập half-precision và enforce-eager phù hợp card 24 GB, mở ra endpoint tương thích OpenAI.
      - name: "[Kokoro Vietnamese TTS Server](https://github.com/tanpham380/tts-kokoro)"
        date: 2025
