# Curated project pool — the SINGLE source for the `Projects:` block in both CV editions.
#
# Why this file exists:
#   - `cv/PhamThanhTan-*.yaml` keeps STATIC facts (work experience, education, certs) written by hand.
#   - `Projects:` is GENERATED from here, so a new project is added once, in both languages.
#   - Nothing is auto-invented: text below is written by the author. GitHub + experiment/ are only
#     used to VERIFY that what is claimed still exists and to discover what is missing.
#
# Commands:
#   python3 .agents/skills/cv-builder/scripts/sync-projects.py              # check for drift
#   python3 .agents/skills/cv-builder/scripts/sync-projects.py --apply      # write into both YAMLs
#   python3 .agents/skills/cv-builder/scripts/sync-projects.py --scaffold <repo>   # add a stub entry
#
# Fields per project:
#   id            stable slug, used in reports
#   repo          GitHub repo name to verify (omit for non-GitHub projects)
#   homepage      optional live URL
#   date / start_date / end_date / position / location   RenderCV entry fields
#   experiment    optional: `####` heading prefix in experiment/README.md it belongs to
#   en / vi       { title, bullets[] }  — both languages required

