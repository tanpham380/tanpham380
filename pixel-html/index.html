<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gói Con Tim Làm Quà - Pixel Karaoke Terminal Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #000000;
      --sky-top: #05070d;
      --sky-mid: #0b101c;
      --sky-bottom: #14192b;
      --ground-bg: #0d111a;
      --ground-line: #1c2436;
      --term-cyan: #4ea8de;
      --term-green: #3fb950;
      --term-white: #e6edf3;
      --term-gray: #8b949e;
      --term-dim: #484f58;
      --bot-red: #ea4335;
      --bot-pink: #f48fb1;
      --bot-bow: #ffd54f;
      --bot-cap: #4285f4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030407;
      background-image: 
        radial-gradient(rgba(78, 168, 222, 0.08) 1px, transparent 1px),
        linear-gradient(180deg, #030407 0%, #090e18 100%);
      background-size: 24px 24px, 100% 100%;
      color: var(--term-white);
      font-family: 'Fira Code', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* THANH CÔNG CỤ TÙY BIẾN RETRO */
    .retro-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 450px;
      margin-bottom: 12px;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tool-btn {
      background: #111622;
      border: 1px solid #232c3d;
      color: var(--term-white);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: #1a2233;
      border-color: var(--term-cyan);
    }

    .tool-btn.active {
      border-color: var(--term-green);
      color: var(--term-green);
      background: rgba(46, 160, 67, 0.12);
    }

    /* MÀN HÌNH CHÍNH PIXEL TERMINAL */
    .retro-screen {
      width: 100%;
      max-width: 450px;
      background-color: var(--bg-black);
      border-radius: 10px;
      box-shadow: 
        0 0 50px rgba(0, 0, 0, 0.95), 
        0 0 25px rgba(78, 168, 222, 0.15);
      border: 1px solid #1c2333;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* HIỆU ỨNG MÀN HÌNH CỔ ĐIỂN CRT SCANLINES */
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.28) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 99;
      opacity: 0.65;
      display: block;
    }

    .crt-overlay.disabled {
      display: none;
    }

    /* 1. SÂN KHẤU PIXEL NỀN ĐÊM */
    .pixel-stage {
      height: 250px;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 65%, var(--sky-bottom) 100%);
      position: relative;
      overflow: hidden;
      border-bottom: 2px solid #161e2e;
      cursor: crosshair;
    }

    /* Canvas vẽ sao, sao băng, đom đóm và cánh hoa rơi */
    .fx-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Mặt trăng Pixel tròn khuyết */
    .pixel-moon {
      position: absolute;
      top: 28px;
      right: 46px;
      width: 32px;
      height: 32px;
      background: #cdd6e5;
      box-shadow: 
        inset -4px -4px 0 #92a4c2,
        0 0 18px rgba(205, 214, 229, 0.45);
      image-rendering: pixelated;
      z-index: 1;
    }

    /* Cây thông pixel 8-bit */
    .pixel-tree {
      position: absolute;
      bottom: 24px;
      width: 24px;
      height: 50px;
      image-rendering: pixelated;
      opacity: 0.45;
      pointer-events: none;
      z-index: 3;
    }
    .tree-left { left: 18px; }
    .tree-right { right: 20px; }

    /* Mặt đất */
    .ground-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 24px;
      background: var(--ground-bg);
      border-top: 3px solid var(--ground-line);
      z-index: 3;
    }

    /* KHU VỰC 2 NHÂN VẬT PIXEL */
    .actors-container {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      height: 85px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 45px;
      z-index: 5;
    }

    .pixel-actor {
      width: 76px;
      height: 64px;
      position: relative;
      transition: transform 0.75s cubic-bezier(0.34, 1.4, 0.64, 1);
      transform-origin: bottom center;
      cursor: pointer;
      pointer-events: auto;
    }

    /* Nhún nhảy theo nhịp nhạc */
    .pixel-actor.bobbing {
      animation: pixelBob 0.58s infinite alternate steps(2);
    }

    @keyframes pixelBob {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }

    /* Nhảy cẫng lên khi người dùng chạm vào (Easter Egg) */
    .pixel-actor.jumping {
      animation: playerJump 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes playerJump {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-24px) scale(1.08); }
      100% { transform: translateY(0) scale(1); }
    }

    /* Mắt trái tim của robot nữ */
    .heart-eye {
      display: none;
    }

    /* Má hồng robot nữ khi e thẹn nhận hoa */
    .blush-cheek {
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    /* Nhành hoa hồng trao tặng */
    .flower-gift {
      position: absolute;
      bottom: 30px;
      left: calc(50% - 14px);
      width: 28px;
      height: 28px;
      transform: scale(0) rotate(-30deg);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
      pointer-events: none;
    }

    /* Bong bóng tim lơ lửng */
    .floating-heart {
      position: absolute;
      top: -30px;
      left: 24px;
      font-size: 24px;
      opacity: 0;
      transform: translateY(0) scale(0.6);
      transition: all 0.5s ease-out;
      pointer-events: none;
    }

    /* CÁC GIAI ĐOẠN TƯƠNG TÁC */
    /* 1. Lại gần */
    .stage-approach #actor-boy {
      transform: translateX(58px);
    }
    .stage-approach #actor-girl {
      transform: translateX(-40px);
    }

    /* 2. Trao nhành hoa + tim bay + má hồng + mắt trái tim (♥_♥) */
    .stage-give-flower #actor-boy {
      transform: translateX(82px);
    }
    .stage-give-flower #actor-girl {
      transform: translateX(-52px);
    }
    .stage-give-flower .flower-gift {
      opacity: 1;
      transform: scale(1.3) rotate(0deg);
    }
    .stage-give-flower .floating-heart {
      opacity: 1;
      transform: translateY(-24px) scale(1.2);
    }
    .stage-give-flower #actor-girl .blush-cheek {
      opacity: 1;
    }
    .stage-give-flower #actor-girl .normal-eye {
      display: none;
    }
    .stage-give-flower #actor-girl .heart-eye {
      display: block;
    }

    /* Tim bay tự do khi bấm vào màn hình */
    .click-heart {
      position: absolute;
      pointer-events: none;
      font-size: 20px;
      animation: heartFloatUp 0.8s forwards cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
    }

    @keyframes heartFloatUp {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
      100% { opacity: 0; transform: translate(-50%, -100px) scale(1.3); }
    }

    /* 2. BẢNG TERMINAL LYRICS CHUẨN ẢNH MẪU */
    .terminal-section {
      background-color: var(--bg-black);
      padding: 22px 24px 24px 24px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .song-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--term-cyan);
      letter-spacing: 0.3px;
      margin-bottom: 6px;
      text-shadow: 0 0 16px rgba(78, 168, 222, 0.35);
    }

    .song-artist {
      font-size: 0.95rem;
      color: var(--term-white);
      margin-bottom: 22px;
      letter-spacing: 0.2px;
    }

    .song-artist .mode-tag {
      color: var(--term-gray);
      margin-left: 4px;
    }

    /* Danh sách dòng lời */
    .lyrics-lines {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .lyric-row {
      font-size: 1rem;
      line-height: 1.5;
      color: var(--term-dim);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      transition: color 0.2s ease;
      cursor: pointer;
    }

    .line-number {
      margin-right: 10px;
    }

    /* Đã hát xong: Màu xanh lá + dấu tích ✓ */
    .lyric-row.done {
      color: var(--term-green);
    }

    .lyric-row.done .check-mark {
      margin-left: 10px;
      color: var(--term-green);
      font-weight: bold;
    }

    /* Đang hát: Xanh Cyan */
    .lyric-row.active {
      color: var(--term-cyan);
    }

    .lyric-token {
      display: inline-block;
      padding: 0 1px;
      transition: all 0.12s;
    }

    /* Khối highlight từng từ đang hát chuẩn Terminal */
    .lyric-token.highlighted {
      background: var(--term-cyan);
      color: #000 !important;
      font-weight: 700;
      padding: 0 3px;
      box-shadow: 0 0 10px rgba(78, 168, 222, 0.6);
    }

    /* Con trỏ khối retro nhấp nháy */
    .term-cursor {
      display: inline-block;
      width: 9px;
      height: 17px;
      background-color: var(--term-cyan);
      margin-left: 2px;
      vertical-align: -2px;
      animation: blinkCursor 0.75s infinite;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Dòng trạng thái terminal dưới đáy */
    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--term-gray);
      font-size: 0.85rem;
      padding-top: 14px;
      border-top: 1px dashed #1a2333;
      letter-spacing: 0.2px;
    }

    .time-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Thanh tiến trình mini */
    .mini-progress {
      width: 100%;
      height: 3px;
      background: #111622;
      position: absolute;
      bottom: 0;
      left: 0;
      cursor: pointer;
    }

    .mini-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--term-cyan);
      transition: width 0.08s linear;
    }

    /* Thẻ thông báo Toast */
    .toast-chip {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: #161f30;
      border: 1px solid var(--term-cyan);
      color: #fff;
      padding: 5px 12px;
      font-size: 0.75rem;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s;
      z-index: 100;
    }

    .toast-chip.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Input ẩn tải file MP3 */
    #custom-audio-input {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Thanh công cụ retro phía trên -->
  <div class="retro-toolbar">
    <select id="song-select" class="tool-btn" title="Chọn bài hát">
      <option value="0">🎶 Gói Con Tim Làm Quà</option>
      <option value="1">🎶 Đêm Nay Một Mình</option>
      <option value="2">🎶 Tình Yêu Cũ</option>
      <option value="3">🎶 Yêu Anh Quá Nhiều</option>
      <option value="4">🎶 Nửa Còn Lại</option>
    </select>
    <button class="tool-btn active" id="btn-play">
      <span id="play-icon">⏸</span> <span id="play-text">Tạm dừng</span>
    </button>
    <button class="tool-btn active" id="btn-sound">
      <span id="sound-icon">🔊</span> 8-Bit Lo-Fi
    </button>
    <button class="tool-btn active" id="btn-crt">
      <span>📺</span> CRT Filter
    </button>
    <button class="tool-btn" id="btn-upload">
      <span>🎵</span> Thêm MP3
    </button>
    <button class="tool-btn" id="btn-restart">
      <span>🔄</span> Phát lại
    </button>
    <input type="file" id="custom-audio-input" accept="audio/*">
  </div>

  <!-- MÀN HÌNH CHÍNH PIXEL TERMINAL -->
  <div class="retro-screen" id="retro-screen">
    
    <!-- Lớp phủ vệt quét màn hình cổ CRT Scanlines -->
    <div class="crt-overlay" id="crt-overlay"></div>

    <div class="toast-chip" id="toast-tip">Phím tắt Ctrl+T: Bật/Tắt Karaoke</div>

    <!-- SÂN KHẤU PIXEL NỀN ĐÊM -->
    <div class="pixel-stage" id="stage-wrapper" title="Nhấp vào sân khấu hoặc nhân vật để tương tác!">
      <!-- Canvas vẽ sao lấp lánh, sao băng, đom đóm và cánh hoa đào rơi -->
      <canvas class="fx-canvas" id="fx-canvas"></canvas>
      
      <div class="pixel-moon"></div>

      <!-- Cây thông Pixel -->
      <svg class="pixel-tree tree-left" viewBox="0 0 20 40" shape-rendering="crispEdges">
        <rect x="8" y="24" width="4" height="16" fill="#0f1620"/>
        <rect x="4" y="16" width="12" height="10" fill="#141f2d"/>
        <rect x="6" y="6" width="8" height="10" fill="#1b293c"/>
        <rect x="8" y="0" width="4" height="6" fill="#24374f"/>
      </svg>

      <svg class="pixel-tree tree-right" viewBox="0 0 20 40" shape-rendering="crispEdges">
        <rect x="8" y="24" width="4" height="16" fill="#0f1620"/>
        <rect x="4" y="14" width="12" height="12" fill="#141f2d"/>
        <rect x="6" y="4" width="8" height="10" fill="#1b293c"/>
      </svg>

      <!-- Mặt đất -->
      <div class="ground-bar"></div>

      <!-- KHU VỰC 2 NHÂN VẬT PIXEL -->
      <div class="actors-container">
        
        <!-- NHÂN VẬT ĐỎ MŨ XANH (BÊN TRÁI) -->
        <div class="pixel-actor bobbing" id="actor-boy" title="Nhấp để nhân vật nhảy!">
          <svg viewBox="0 0 68 56" width="100%" height="100%" shape-rendering="crispEdges">
            <!-- Mũ Xanh -->
            <rect x="28" y="6" width="12" height="8" fill="#3b82f6"/>
            <rect x="30" y="8" width="8" height="4" fill="#60a5fa"/>

            <!-- Thân Robot Đỏ -->
            <rect x="14" y="14" width="40" height="22" fill="#ea4335"/>
            <rect x="18" y="12" width="32" height="26" fill="#dc2626"/>
            <rect x="6" y="22" width="56" height="10" fill="#b91c1c"/>
            <rect x="2" y="24" width="64" height="6" fill="#991b1b"/>

            <!-- Mắt Pixel -->
            <rect x="20" y="20" width="6" height="4" fill="#0c0e14"/>
            <rect x="42" y="20" width="6" height="4" fill="#0c0e14"/>

            <!-- 2 Chân -->
            <rect x="20" y="38" width="8" height="14" fill="#ea4335"/>
            <rect x="40" y="38" width="8" height="14" fill="#ea4335"/>
            <rect x="18" y="48" width="12" height="4" fill="#991b1b"/>
            <rect x="38" y="48" width="12" height="4" fill="#991b1b"/>
          </svg>
        </div>

        <!-- NHÀNH HOA HỒNG PIXEL -->
        <div class="flower-gift" id="flower-gift">
          <svg viewBox="0 0 32 32" width="100%" height="100%" shape-rendering="crispEdges">
            <rect x="14" y="16" width="4" height="14" fill="#22c55e"/>
            <rect x="10" y="20" width="4" height="4" fill="#16a34a"/>
            <rect x="18" y="22" width="4" height="4" fill="#16a34a"/>
            <rect x="8" y="8" width="16" height="10" fill="#f43f5e"/>
            <rect x="10" y="4" width="12" height="16" fill="#fb7185"/>
            <rect x="12" y="8" width="8" height="6" fill="#fef08a"/>
          </svg>
        </div>

        <!-- NHÂN VẬT HỒNG NƠ VÀNG (BÊN PHẢI) -->
        <div class="pixel-actor bobbing" id="actor-girl" title="Nhấp để nhân vật nhảy!">
          <!-- Tim bay bổng khi nhận hoa -->
          <div class="floating-heart" id="floating-heart">💖</div>

          <svg viewBox="0 0 68 56" width="100%" height="100%" shape-rendering="crispEdges">
            <!-- Nơ Vàng -->
            <rect x="24" y="6" width="8" height="8" fill="#ffd54f"/>
            <rect x="36" y="6" width="8" height="8" fill="#ffd54f"/>
            <rect x="30" y="8" width="8" height="4" fill="#f59e0b"/>

            <!-- Thân Robot Hồng -->
            <rect x="14" y="14" width="40" height="22" fill="#f48fb1"/>
            <rect x="18" y="12" width="32" height="26" fill="#ec4899"/>
            <rect x="6" y="22" width="56" height="10" fill="#db2777"/>
            <rect x="2" y="24" width="64" height="6" fill="#be185d"/>

            <!-- Mắt thường -->
            <g class="normal-eye">
              <rect x="20" y="20" width="6" height="4" fill="#0c0e14"/>
              <rect x="42" y="20" width="6" height="4" fill="#0c0e14"/>
            </g>

            <!-- Mắt trái tim biểu cảm đặc biệt khi nhận hoa (♥_♥) -->
            <g class="heart-eye">
              <rect x="19" y="19" width="3" height="3" fill="#e11d48"/>
              <rect x="23" y="19" width="3" height="3" fill="#e11d48"/>
              <rect x="18" y="21" width="9" height="3" fill="#f43f5e"/>
              <rect x="20" y="24" width="5" height="2" fill="#f43f5e"/>

              <rect x="41" y="19" width="3" height="3" fill="#e11d48"/>
              <rect x="45" y="19" width="3" height="3" fill="#e11d48"/>
              <rect x="40" y="21" width="9" height="3" fill="#f43f5e"/>
              <rect x="42" y="24" width="5" height="2" fill="#f43f5e"/>
            </g>

            <!-- 2 Vệt má hồng pixel khi ngượng ngùng -->
            <g class="blush-cheek">
              <rect x="14" y="24" width="6" height="3" fill="#f43f5e"/>
              <rect x="48" y="24" width="6" height="3" fill="#f43f5e"/>
            </g>

            <!-- 2 Chân -->
            <rect x="20" y="38" width="8" height="14" fill="#f48fb1"/>
            <rect x="40" y="38" width="8" height="14" fill="#f48fb1"/>
            <rect x="18" y="48" width="12" height="4" fill="#be185d"/>
            <rect x="38" y="48" width="12" height="4" fill="#be185d"/>
          </svg>
        </div>

      </div>
    </div>

    <!-- PHẦN TERMINAL LYRICS -->
    <div class="terminal-section">
      <!-- Tiêu đề & Tác giả -->
      <div class="song-title" id="song-title">Gói Con Tim Làm Quà</div>
      <div class="song-artist">
        <span id="song-artist">Nguyễn Hùng, Mounter</span> <span class="mode-tag">• karaoke mode</span>
      </div>

      <!-- 4 Dòng Lời Bài Hát -->
      <div class="lyrics-lines" id="lyrics-lines">
        <!-- Đổ tự động bằng JS -->
      </div>

      <!-- Dòng trạng thái terminal dưới đáy -->
      <div class="status-line">
        <div class="time-badge">
          <span id="time-display">♪ 0:08 / 0:46</span>
        </div>
        <div>
          <span>karaoke: on (ctrl+t to disable)</span>
        </div>
      </div>

      <!-- Thanh tiến trình nhỏ ở đáy -->
      <div class="mini-progress" id="progress-bar">
        <div class="mini-progress-fill" id="progress-fill"></div>
      </div>
    </div>

  </div>

  <audio id="external-audio" style="display:none;"></audio>

  <script>
    /* ==========================================================
       1. TẦN SỐ NỐT NHẠC 8-BIT CHIPTUNE
       ========================================================== */
    const TONES = {
      C4: 261.63,
      D4: 293.66,
      E4: 329.63,
      F4: 349.23,
      G4: 392.00,
      A4: 440.00,
      B4: 493.88,
      C5: 523.25,
      D5: 587.33

    // Co giãn toàn bộ mốc thời gian lời theo hệ số LYRIC_SCALE
    // (áp dụng khi người dùng tải một file MP3 có độ dài khác bài gốc)
    function rescaleLyrics(scale) {
      if (!scale || scale <= 0) return;
      lyricsData.forEach((line) => {

    /* ==========================================================

       ========================================================== */
    let audioCtx = null;
    let isSoundOn = true;
    let playedNotesMap = {};
    let customAudio = document.getElementById("external-audio");
    let isUsingCustomAudio = false;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Phát nốt chiptune giai điệu bài hát
    function play8BitTone(freq, duration) {
      if (!isSoundOn || isUsingCustomAudio) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "square";
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.07, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + duration + 0.05);

      // Bass trầm tam giác đệm theo
      const subOsc = ctx.createOscillator();
      const subGain = ctx.createGain();
      subOsc.type = "triangle";
      subOsc.frequency.setValueAtTime(freq / 2, now);
      subGain.gain.setValueAtTime(0.035, now);
      subGain.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.85);
      subOsc.connect(subGain);
      subGain.connect(ctx.destination);
      subOsc.start(now);
      subOsc.stop(now + duration);
    }

    // Tiếng trống 8-Bit Kick nhẹ nhàng
    function play8BitKick() {
      if (!isSoundOn || isUsingCustomAudio) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(130, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);

      gain.gain.setValueAtTime(0.07, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.14);
    }

    // Tiếng trống 8-Bit Hi-hat noise nhuyễn
    function play8BitHihat() {
      if (!isSoundOn || isUsingCustomAudio) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;

      const bufferSize = ctx.sampleRate * 0.04;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = "highpass";
      filter.frequency.value = 7000;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.02, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      noise.start(now);
    }

    // Âm thanh tương tác nhảy "Boing"
    function playJumpSFX() {
      if (!isSoundOn) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "square";
      osc.frequency.setValueAtTime(260, now);
      osc.frequency.exponentialRampToValueAtTime(580, now + 0.18);

      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    }

      if (!isSoundOn || isUsingCustomAudio) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, now + idx * 0.08);
        gain.gain.setValueAtTime(0.04, now + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.32);
      });
    }

    const fxCanvas = document.getElementById("fx-canvas");
    const fCtx = fxCanvas.getContext("2d");
    let stars = [];
    let shootingStar = null;
    let petals = [];

    function setupCanvasFX() {
      fxCanvas.width = fxCanvas.offsetWidth || 450;
      fxCanvas.height = fxCanvas.offsetHeight || 250;
      stars = [];
      for (let i = 0; i < 35; i++) {
        stars.push({
          x: Math.floor(Math.random() * fxCanvas.width),
          y: Math.floor(Math.random() * (fxCanvas.height - 35)),
          size: Math.random() > 0.8 ? 3 : 2,
          speed: 0.02 + Math.random() * 0.03,
          opacity: Math.random()
        });
      }

      // Khởi tạo cánh hoa rơi
      petals = [];
      for (let i = 0; i < 18; i++) {
        petals.push({
          x: Math.random() * fxCanvas.width,
          y: Math.random() * fxCanvas.height,
          size: 2 + Math.floor(Math.random() * 3),
          speedY: 0.6 + Math.random() * 0.8,
          speedX: 0.4 + Math.random() * 0.6,
          active: false
        });
      }
    }

    // Kích hoạt sao băng ngẫu nhiên
    function triggerShootingStar() {
      if (!shootingStar && Math.random() < 0.008) {
        shootingStar = {
          x: Math.random() * (fxCanvas.width * 0.7),
          y: Math.random() * 60,
          dx: 5 + Math.random() * 3,
          dy: 2.5 + Math.random() * 1.5,
          length: 35,
          opacity: 1
        };
      }
    }

    function renderFX(isFlowerGiving) {
      fCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

      // Vẽ sao lấp lánh
      stars.forEach(s => {
        s.opacity += s.speed;
        if (s.opacity > 1 || s.opacity < 0.2) s.speed = -s.speed;
        fCtx.fillStyle = `rgba(255, 255, 255, ${s.opacity.toFixed(2)})`;
        fCtx.fillRect(s.x, s.y, s.size, s.size);
      });

      // Vẽ sao băng
      triggerShootingStar();
      if (shootingStar) {
        fCtx.strokeStyle = `rgba(255, 255, 255, ${shootingStar.opacity})`;
        fCtx.lineWidth = 2;
        fCtx.beginPath();
        fCtx.moveTo(shootingStar.x, shootingStar.y);
        fCtx.lineTo(shootingStar.x - shootingStar.length, shootingStar.y - (shootingStar.length * 0.5));
        fCtx.stroke();

        shootingStar.x += shootingStar.dx;
        shootingStar.y += shootingStar.dy;
        shootingStar.opacity -= 0.025;

        if (shootingStar.opacity <= 0 || shootingStar.x > fxCanvas.width) {
          shootingStar = null;
        }
      }

      // Vẽ cánh hoa hồng pixel rơi khi vào giai đoạn tặng hoa
      if (isFlowerGiving) {
        petals.forEach(p => {
          fCtx.fillStyle = "#f472b6";
          fCtx.fillRect(p.x, p.y, p.size, p.size);
          p.y += p.speedY;
          p.x += Math.sin(p.y * 0.05) * p.speedX;

          if (p.y > fxCanvas.height - 24) {
            p.y = -5;
            p.x = Math.random() * fxCanvas.width;
          }
        });
      }

      requestAnimationFrame(() => renderFX(stageWrapper.classList.contains("stage-give-flower")));
    }

    /* ==========================================================
       5. TẠO DOM LYRICS THEO CHUẨN ẢNH MẪU
       ========================================================== */
    const lyricsContainer = document.getElementById("lyrics-lines");
    const songTitleEl = document.getElementById("song-title");
    const songArtistEl = document.getElementById("song-artist");
    const songSelectEl = document.getElementById("song-select");

    // Chuyển bài hát (reset lại lời, mốc thời gian và hoạt hình về đầu bài)
    function selectSong(index) {
      if (index < 0 || index >= SONGS.length) return;
      currentSongIndex = index;
      lyricsData = SONGS[currentSongIndex].lines;

      // Reset lại mốc thời gian gốc (undo co giãn MP3 trước đó)
      LYRIC_SCALE = 1;
      SONG_DURATION = BASE_DURATION;

      // Cập nhật tiêu đề & tác giả động
      songTitleEl.textContent = SONGS[currentSongIndex].title;
      songArtistEl.textContent = SONGS[currentSongIndex].artist;

      // Reset DOM lời & trạng thái phát
      renderLyricsDOM();
      currentTime = 0;
      playedNotesMap = {};
      lastBeatSecond = -1;
      flowerChimeTriggered = false;
      syncKaraoke(0);
      showToast(`🎵 ${SONGS[currentSongIndex].title}`);
    }

    // Sự kiện chọn bài từ thanh công cụ
    songSelectEl.addEventListener("change", (e) => {
      selectSong(parseInt(e.target.value, 10));
    });

    function renderLyricsDOM() {
      lyricsContainer.innerHTML = "";
      lyricsData.forEach((line) => {
        const row = document.createElement("div");
        row.className = "lyric-row";
        row.id = `line-${line.lineIndex}`;

        const num = document.createElement("span");
        num.className = "line-number";
        num.textContent = `${line.lineIndex}.`;
        row.appendChild(num);

        const wordsWrap = document.createElement("span");
        line.words.forEach((w, wIdx) => {
          const wSpan = document.createElement("span");
          wSpan.className = "lyric-token";
          wSpan.id = `token-${line.lineIndex}-${wIdx}`;
          wSpan.textContent = w.text;
          wordsWrap.appendChild(wSpan);

          if (wIdx < line.words.length - 1) {
            wordsWrap.appendChild(document.createTextNode(" "));
          }
        });

        row.appendChild(wordsWrap);
        lyricsContainer.appendChild(row);

        // Bấm câu để tua
        row.addEventListener("click", () => {
          currentTime = line.startTime;
          if (isUsingCustomAudio) {
            customAudio.currentTime = currentTime;
          }
          playedNotesMap = {};
          syncKaraoke(currentTime);
        });
      });
    }

    /* ==========================================================
       6. BỘ ĐỒNG BỘ THỜI GIAN, CHỮ NHẢY & NHÂN VẬT
       ========================================================== */
    let currentTime = 0;
    let isPlaying = true;
    let lastTime = null;
    let lastBeatSecond = -1;

    const stageWrapper = document.getElementById("stage-wrapper");
    const progressFill = document.getElementById("progress-fill");
    const timeDisplay = document.getElementById("time-display");

    function formatTimeDisplay(sec) {
      const s = Math.floor(sec);
      return `♪ 0:${s < 10 ? "0" : ""}${s} / 0:${Math.floor(SONG_DURATION)}`;
    }

    function syncKaraoke(time) {
      // 1. Cập nhật thanh tiến trình
      const percent = Math.min((time / SONG_DURATION) * 100, 100);
      progressFill.style.width = `${percent}%`;
      timeDisplay.textContent = formatTimeDisplay(time);

      // 2. Nhịp trống Lo-Fi 8-bit tự động
      const currentBeat = Math.floor(time * 2); // 120 BPM
      if (currentBeat !== lastBeatSecond) {
        lastBeatSecond = currentBeat;
        if (currentBeat % 2 === 0) {
          play8BitKick();
        } else {
          play8BitHihat();
        }
      }

      // 3. Cập nhật lời bài hát & con trỏ terminal
      lyricsData.forEach((line) => {
        const rowEl = document.getElementById(`line-${line.lineIndex}`);
        if (!rowEl) return;

        // Câu đã hát xong
        if (time >= line.endTime) {
          rowEl.className = "lyric-row done";
          if (!rowEl.querySelector(".check-mark")) {
            const ck = document.createElement("span");
            ck.className = "check-mark";
            ck.textContent = "✓";
            rowEl.appendChild(ck);
          }
          const cur = rowEl.querySelector(".term-cursor");
          if (cur) cur.remove();
          line.words.forEach((_, wIdx) => {
            const token = document.getElementById(`token-${line.lineIndex}-${wIdx}`);
            if (token) token.className = "lyric-token";
          });
        }
        // Câu đang hát
        else if (time >= line.startTime && time < line.endTime) {
          rowEl.className = "lyric-row active";
          const ck = rowEl.querySelector(".check-mark");
          if (ck) ck.remove();

          let currentWordIdx = -1;
          for (let i = 0; i < line.words.length; i++) {
            if (time >= line.words[i].time) {
              currentWordIdx = i;
            }
          }

          line.words.forEach((w, wIdx) => {
            const token = document.getElementById(`token-${line.lineIndex}-${wIdx}`);
            if (!token) return;

            if (wIdx === currentWordIdx) {
              token.className = "lyric-token highlighted";

              // Phát nốt chiptune đúng từ
              const noteKey = `${line.lineIndex}-${wIdx}`;
              if (!playedNotesMap[noteKey]) {
                playedNotesMap[noteKey] = true;
                play8BitTone(TONES[w.note], w.dur);
              }
            } else {
              token.className = "lyric-token";
            }
          });

          // Con trỏ bám sau từ
          let cursor = rowEl.querySelector(".term-cursor");
          if (!cursor) {
            cursor = document.createElement("span");
            cursor.className = "term-cursor";
          }
          if (currentWordIdx >= 0) {
            const currentToken = document.getElementById(`token-${line.lineIndex}-${currentWordIdx}`);
            if (currentToken && currentToken.nextSibling !== cursor) {
              currentToken.parentNode.insertBefore(cursor, currentToken.nextSibling);
            }
          }
        }
        // Chưa đến
        else {
          rowEl.className = "lyric-row";
          const ck = rowEl.querySelector(".check-mark");
          if (ck) ck.remove();
          const cur = rowEl.querySelector(".term-cursor");
          if (cur) cur.remove();
          line.words.forEach((_, wIdx) => {
            const token = document.getElementById(`token-${line.lineIndex}-${wIdx}`);
            if (token) token.className = "lyric-token";
          });
        }
      });

      // 4. KỊCH BẢN HOẠT CẢNH NHÂN VẬT & BIỂU CẢM
      // Tự căn mốc hoạt động theo lời (đã được co giãn theo nhạc thực tế)
      const approachAt = lyricsData[1]?.startTime ?? 4.4;
      const giveAt = lyricsData[2]?.startTime ?? 8.3;
      if (time >= giveAt) {
        // Tặng hoa + má hồng + tim bay + mắt tim (♥_♥)
        stageWrapper.className = "pixel-stage stage-give-flower";
        if (!flowerChimeTriggered) {
          flowerChimeTriggered = true;
          playChimeSFX();
        }
      } else if (time >= approachAt) {
        // Lại gần
        stageWrapper.className = "pixel-stage stage-approach";
        flowerChimeTriggered = false;
      } else {
        // Vị trí gốc
        stageWrapper.className = "pixel-stage";
        flowerChimeTriggered = false;
      }
    }

    function mainEngine(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      if (isPlaying) {
        if (isUsingCustomAudio) {
          currentTime = customAudio.currentTime;
          if (customAudio.ended) {
            currentTime = 0;
            customAudio.play();
          }
        } else {
          currentTime += delta;
          if (currentTime >= SONG_DURATION) {
            currentTime = 0;
            playedNotesMap = {};
          }
        }

        syncKaraoke(currentTime);
      }

      requestAnimationFrame(mainEngine);
    }

    /* ==========================================================
       7. CÁC NÚT ĐIỀU KHIỂN & SỰ KIỆN TƯƠNG TÁC
       ========================================================== */
    const btnPlay = document.getElementById("btn-play");
    const playIcon = document.getElementById("play-icon");
    const playText = document.getElementById("play-text");
    const btnSound = document.getElementById("btn-sound");
    const soundIcon = document.getElementById("sound-icon");
    const btnCrt = document.getElementById("btn-crt");
    const crtOverlay = document.getElementById("crt-overlay");
    const toastTip = document.getElementById("toast-tip");

    function showToast(msg) {
      toastTip.textContent = msg;
      toastTip.classList.add("show");
      setTimeout(() => toastTip.classList.remove("show"), 2000);
    }

    function togglePlayback() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        getAudioCtx();
        if (isUsingCustomAudio) customAudio.play();
        playIcon.textContent = "⏸";
        playText.textContent = "Tạm dừng";
        btnPlay.classList.add("active");
        document.querySelectorAll(".pixel-actor").forEach(a => a.classList.add("bobbing"));
      } else {
        if (isUsingCustomAudio) customAudio.pause();
        playIcon.textContent = "▶";
        playText.textContent = "Phát tiếp";
        btnPlay.classList.remove("active");
        document.querySelectorAll(".pixel-actor").forEach(a => a.classList.remove("bobbing"));
      }
    }

    btnPlay.addEventListener("click", togglePlayback);

    // Bật/Tắt âm thanh 8-Bit
    btnSound.addEventListener("click", () => {
      getAudioCtx();
      isSoundOn = !isSoundOn;
      if (isSoundOn) {
        btnSound.classList.add("active");
        soundIcon.textContent = "🔊";
        showToast("Âm thanh 8-Bit Lo-Fi: Bật");
      } else {
        btnSound.classList.remove("active");
        soundIcon.textContent = "🔇";
        showToast("Âm thanh: Tắt");
      }
    });

    // Bật/Tắt hiệu ứng CRT Scanlines
    btnCrt.addEventListener("click", () => {
      crtOverlay.classList.toggle("disabled");
      const isEnabled = !crtOverlay.classList.contains("disabled");
      btnCrt.classList.toggle("active", isEnabled);
      showToast(isEnabled ? "Đã bật hiệu ứng quét mành CRT" : "Đã tắt hiệu ứng CRT");
    });

    // Nút tải file nhạc MP3 tùy biến
    const btnUpload = document.getElementById("btn-upload");
    const fileInput = document.getElementById("custom-audio-input");
    btnUpload.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        customAudio.src = url;
        customAudio.currentTime = 0;
        customAudio.play();
        isUsingCustomAudio = true;
        btnUpload.classList.add("active");
        btnUpload.innerHTML = `<span>🎵</span> Nhạc: Đang phát`;

        // Tự động co giãn lời theo độ dài thật của file nhạc vừa tải
        customAudio.addEventListener("loadedmetadata", function onMeta() {
          const realDur = customAudio.duration;
          if (realDur && realDur > 0) {
            LYRIC_SCALE = realDur / BASE_DURATION;
            SONG_DURATION = realDur;
            rescaleLyrics(LYRIC_SCALE);
            showToast(`Đã căn lời tự động theo ${realDur.toFixed(1)}s`);
          }
          customAudio.removeEventListener("loadedmetadata", onMeta);
        }, { once: true });

        showToast(`Đang phát nhạc: ${file.name.substring(0, 16)}...`);
      }
    });

    // Phát lại từ đầu
    document.getElementById("btn-restart").addEventListener("click", () => {
      currentTime = 0;
      playedNotesMap = {};
      if (isUsingCustomAudio) customAudio.currentTime = 0;
      syncKaraoke(0);
      if (!isPlaying) togglePlayback();
      showToast("🔄 Đã phát lại từ đầu");
    });

    // Nhấp thanh tiến trình để tua
    document.getElementById("progress-bar").addEventListener("click", (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      currentTime = ratio * SONG_DURATION;
      if (isUsingCustomAudio) customAudio.currentTime = currentTime;
      playedNotesMap = {};
      syncKaraoke(currentTime);
    });

    // Tương tác chạm vào nhân vật để nhảy cẫng lên (Easter Egg)
    function triggerJump(actor) {
      actor.classList.remove("jumping");
      void actor.offsetWidth;
      actor.classList.add("jumping");
      playJumpSFX();
    }

    document.getElementById("actor-boy").addEventListener("click", (e) => {
      e.stopPropagation();
      triggerJump(document.getElementById("actor-boy"));
      showToast("🤖 Robot Đỏ: Cố lên nào!");
    });

    document.getElementById("actor-girl").addEventListener("click", (e) => {
      e.stopPropagation();
      triggerJump(document.getElementById("actor-girl"));
      showToast("🌸 Robot Hồng: Cảm ơn bạn!");
    });

    // Bấm vào bất kỳ đâu trên sân khấu để bắn tim pixel
    stageWrapper.addEventListener("click", (e) => {
      const rect = stageWrapper.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const heart = document.createElement("div");
      heart.className = "click-heart";
      heart.textContent = Math.random() > 0.5 ? "💖" : "✨";
      heart.style.left = `${x}px`;
      heart.style.top = `${y}px`;

      stageWrapper.appendChild(heart);
      setTimeout(() => heart.remove(), 800);
    });

    // Phím tắt Ctrl + T
    window.addEventListener("keydown", (e) => {
      if (e.ctrlKey && e.key.toLowerCase() === "t") {
        e.preventDefault();
        showToast("Phím tắt: Đã chuyển đổi chế độ Karaoke");
      }
    });

    /* ==========================================================
       8. KHỞI TẠO BAN ĐẦU
       ========================================================== */
    window.addEventListener("load", () => {
      setupCanvasFX();
      renderFX(false);
      renderLyricsDOM();
      syncKaraoke(0);
      requestAnimationFrame(mainEngine);

      // Kích hoạt âm thanh khi chạm bất kỳ đâu lần đầu
      document.body.addEventListener("pointerdown", () => {
        getAudioCtx();
      }, { once: true });
    });

    window.addEventListener("resize", () => {
      setupCanvasFX();
    });
  </script>
</body>
